# forks.yaml — Architectural forks for Thin Signals
# Status: locked | decided | open | closed
# Choice classes: BEST_FIT | MINIMAL | ALTERNATIVE
# operator_gate: true → Architect must not auto-decide; stop for human.

plan_revision: "7.8"
date: "2026-10-12"
architect_policy:
  default_choice: BEST_FIT
  may_auto_decide: [open]
  must_not_reopen_without_adr: [locked, decided, closed]
  autonomy_without_operator: [A1, A2]
  always_operator:
    - operator_gate
    - A3
    - A4
    - secrets
    - security_p1

forks:
  - id: implementation.path
    status: locked
    decision: BEST_FIT
    chosen: logic_skills_plugins_frameworks
    alternatives:
      - id: logic_skills_plugins_frameworks
        summary: Domain logic + adapted skills/plugins/frameworks; no weight training
      - id: train_model_first
        summary: Rejected — no negatives, no GPU, opaque vs P01-P18
    rationale: Operator 2026-09-18/19; ADR-008, ADR-009
    operator_gate: false
    related_waves: [W1-contract]

  - id: tz.classifier
    status: decided
    decision: BEST_FIT
    chosen: logical_scorer
    alternatives:
      - id: logical_scorer
        summary: Deterministic scorer on F-P01..18 + M01..06 with calibrated thresholds; P/R/F1 via ts eval
      - id: sklearn_logistic
        summary: Rejected — 100 positives only, label leakage, opaque relative to patterns
      - id: waiver_after_organizer
        summary: Fallback only if organizers reject logical model reading of "или логически"
    rationale: ADR-009 §A; TZ p.2 «математически (или логически)»
    operator_gate: false
    related_waves: [W2-scorer-eval]
    related_requirements: [TZ-01, EV-01, EV-02, EV-03]

  - id: llm.provider
    status: decided
    decision: openrouter_zdr
    decided_at: "2026-09-22"
    decided_by: operator (organizer Svetlana confirmed in chat 2026-09-22)
    preferred_default: openrouter_zdr
    alternatives:
      - id: openrouter_zdr
        summary: >
          OpenRouter with per-request provider policy {zdr: true, data_collection: deny}
          and org-level ZDR/"no training" enabled. Only TZ-listed model ids:
          primary qwen/qwen3.6-35b-a3b, judge/escalation openai/gpt-5.6-luna,
          fallback qwen/qwen3-235b-a22b-2507; gpt-4.1 reserved (10x price).
      - id: yandex_ai_studio
        summary: YandexGPT 5 / Qwen3 235B via OpenAI-compatible endpoint (not on OpenRouter; needs separate keys)
      - id: gigachat
        summary: GigaChat 2 Lite/Pro/Max API (not on OpenRouter; needs separate keys)
      - id: openai_direct
        summary: gpt-4.1 direct
      - id: local_hf_cpu
        summary: Small Qwen3 via llama.cpp on CPU — slow, no cloud
    selection_rule: >
      Organizer allowed OpenRouter if data protection is on and only ZDR-capable models are used,
      and the architecture description states it. Every response must carry provider + model_id;
      the harness refuses a response whose provider is not in the ZDR endpoint list.
    evidence:
      - reports/llm-provider-zdr-2026-09-22.md
    operator_gate: false
    related_waves: [W1-contract, W3-live]
    related_requirements: [TZ-10, LLM-01]

  - id: backend.reuse
    status: decided
    decision: BEST_FIT
    chosen: self_contained_vm232_research
    alternatives:
      - id: self_contained_vm232_research
        summary: VM232 owns pinned SearXNG and exact-source GPT Researcher; backend VM101 is not required for live search
      - id: extend_via_urls
        summary: Superseded after storage failure — VM101 SearXNG/Docling/TEI/LiteLLM/Playwright by URL
      - id: greenfield_in_workspace
        summary: Everything local — rejected for VM dev, kept as laptop profile
    rationale: Operator 2026-10-12; ADR-010; local contour removes the failed-host dependency without duplicating the product ledger
    operator_gate: false
    related_waves: [W1-contract, W7-local-research]
    related_requirements: [TZ-11, TZ-12, RM-01, RS-01]

  - id: graph.neo4j
    status: closed
    decision: MINIMAL
    chosen: drop_pg_tables
    alternatives:
      - id: drop_pg_tables
        summary: nodes/edges tables in PG; SQL/CTE queries; UI relation list
      - id: projection_now
        summary: Rejected — no Neo4j on VM, 8 days
    rationale: ADR-009 §B; replacement matrix PLAN_7.2 §6
    operator_gate: false
    related_requirements: [RM-01]

  - id: sources.epo_cordis
    status: closed
    decision: MINIMAL
    chosen: stub_unavailable
    alternatives:
      - id: stub_unavailable
        summary: Channel marked unavailable; no zero growth emitted; arXiv/OpenAlex/Crossref/GitHub/Google Patents via SearXNG instead
      - id: enable_after_quota_check
        summary: Only if credentials appear before W3
    rationale: ADR-009; no EPO/CORDIS credentials
    operator_gate: false
    related_waves: [W3-live]

  - id: ui.stack
    status: decided
    decision: MINIMAL
    chosen: streamlit_ru
    alternatives:
      - id: streamlit_ru
        summary: Streamlit pages in Russian — allowed by TZ 3.2
      - id: refine_antd
        summary: React+Refine — only if time remains after W4
    rationale: ADR-009 §B
    operator_gate: false
    related_waves: [W4-ui]
    related_requirements: [TZ-04, TZ-06]

  - id: goal.controller
    status: locked
    decision: MINIMAL
    chosen: three_invariants_in_domain
    alternatives:
      - id: three_invariants_in_domain
        summary: TS-INV-01..03 in domain code; TS-AG-01..18 kept in lineage
      - id: goal_control_in_pg
        summary: Superseded 7.1 design (18 criteria) — too large for hackathon
      - id: auto_goal_daemon
        summary: Rejected — second controller / file ledger
    rationale: ADR-006 → ADR-009 §E
    operator_gate: false
    related_requirements: [TS-INV-01, TS-INV-02, TS-INV-03]

  - id: sot.store
    status: locked
    decision: BEST_FIT
    chosen: postgresql
    alternatives:
      - id: postgresql
        summary: Single writable SoT for facts, runs, decisions, vectors
    rationale: Plan 6.1 + ADR-009
    operator_gate: false

  - id: llm.finetune
    status: locked
    decision: MINIMAL
    chosen: frozen_llm_no_lora
    alternatives:
      - id: frozen_llm_no_lora
        summary: Frozen allowlisted LLM; harness + evidence
      - id: lora_qlora
        summary: Rejected — no GPU, no error corpus
    rationale: Operator 2026-09-19; ADR-009
    operator_gate: false

  - id: hosting.sourcecraft
    status: decided
    decision: BEST_FIT
    chosen: sourcecraft_plus_github_mirror
    alternatives:
      - id: sourcecraft_plus_github_mirror
        summary: SourceCraft canonical remote; GitHub mirror mandatory for submission (TZ p.5)
      - id: sourcecraft_only
        summary: Rejected — TZ requires GitLab/GitHub
    rationale: Operator 2026-09-18; ADR-008; ADR-009 §F
    operator_gate: false
    related_waves: [W1-contract, W5-release]
    related_requirements: [LP-05, TZ-15]

  - id: runtime.adapter
    status: decided
    decision: MINIMAL
    chosen: python_harness_hermes_optional
    alternatives:
      - id: python_harness_hermes_optional
        summary: Explicit Python state machine; Hermes via HTTP allowlist for deep countersearch only
      - id: hermes_primary
        summary: 7.1 default — superseded; adapter boundary kept
      - id: opencode_fallback
        summary: Not needed in first implementation
    rationale: ADR-009 §B
    operator_gate: false
    related_waves: [W3-live]

  - id: adversarial.review
    status: decided
    decision: BEST_FIT
    chosen: evidence_gated_bounded_debate
    alternatives:
      - id: evidence_gated_bounded_debate
        summary: One researcher/critic/defender/control-critic round followed by a deterministic arbiter
      - id: unrestricted_agent_debate
        summary: Rejected — rhetoric, cost and loops can bypass evidence discipline
      - id: current_checklist_only
        summary: Baseline retained until the proposed method wins an independent evaluation
    rationale: ADR-012; operator authorized implementation on 2026-10-12, while activation remains evaluation/release gated
    operator_gate: false
    related_waves: [W8-adversarial-review, W11-adversarial-eval]
    related_requirements: [AR-01]

