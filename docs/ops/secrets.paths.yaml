# secrets.paths.yaml — pointers only (no secret values)
# LivingSet 7.1. Never put token bodies here. Never commit SEC files.

plan_revision: "7.1"
date: "2026-09-18"

secrets:
  - id: sourcecraft.api_pat
    purpose: SourceCraft REST API and src CLI full management
    path: "D:\\WORK\\SEC\\SOURCECRAFT_API_PAVEL.txt"
    vm_path: "/opt/thin-signals/.secrets/SOURCECRAFT_API_PAVEL.txt"
    env: SOURCECRAFT_TOKEN
    recorded_in:
      - docs/ops/SOURCECRAFT.md
      - AGENTS.md
      - STATUS.md
    do_not:
      - commit_value
      - print_in_chat
      - save_to_agentmemory

  - id: sourcecraft.ssh_auth
    purpose: git clone/push over SSH
    path: "D:\\WORK\\SEC\\id_ed25519_sourcecraft"
    pub: "D:\\WORK\\SEC\\id_ed25519_sourcecraft.pub"

  - id: sourcecraft.ssh_sign
    purpose: future commit signing
    path: "D:\\WORK\\SEC\\id_ed25519_sourcecraft_sign"
    pub: "D:\\WORK\\SEC\\id_ed25519_sourcecraft_sign.pub"

  - id: sourcecraft.ssh_auth_vm
    purpose: git push over SSH once the public key is added in the SourceCraft UI
    path: "/opt/thin-signals/.secrets/id_ed25519_sourcecraft"
    pub: "/opt/thin-signals/.secrets/id_ed25519_sourcecraft.pub"
    note: "Public API has no SSH-key method. Key exists locally. Not registered on the account."

  - id: hackathon.materials_password
    purpose: password for organizer materials (TZ / dataset / template)
    path: "/opt/thin-signals/.secrets/materials.password"

  - id: product.pg_password
    purpose: PostgreSQL password for compose service pg (docker secret)
    path: "/opt/thin-signals/.secrets/pg_password"
    env: TS_PG_PASSWORD_FILE

  - id: product.litellm_key
    purpose: LiteLLM virtual key for alias ts-llm-allowlisted (to be issued in W1/W3)
    path: "/opt/thin-signals/.secrets/litellm_key"
    env: TS_LITELLM_KEY_FILE
    status: not_created
