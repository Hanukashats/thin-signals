# Install only after the frozen evaluation and bounded production canary pass.
# This file contains no credentials; the base unit loads them with systemd credentials.
[Service]
Environment=TS_RULES_VERSION=rules-0.1
Environment=TS_GPT_RESEARCHER_ENABLED=true
Environment=TS_GPT_RESEARCHER_URL=http://127.0.0.1:28000
Environment=TS_GPT_RESEARCHER_MAX_COST_USD=0.08
Environment=TS_GPT_RESEARCHER_MAX_LEADS=12
Environment=TS_ADVERSARIAL_REVIEW_ENABLED=true
Environment=TS_REVIEW_TIME_SECONDS=45
Environment=TS_REVIEW_MAX_OUTPUT_TOKENS=1200
Environment=TS_REVIEW_MAX_COST_USD=0.03
Environment=TS_REVIEW_EVIDENCE_LIMIT=12
