    handoff_is_terminal: true
    verifier_is_a_different_bot: true
    telegram_bar_only_while_bot_replies: true
    report_after_each_wave: true
    consecutive_failures_before_stop: 2
    architect_names_unresolved_stoppers: true
    architect_may_close_after_proper_check: true
    proper_check: second_hat_reruns_the_criterion
    implementer_cannot_verify_own_increment: true
  notes: >
    7.2 compresses the 11-step cycle to 4. INTEGRATE must update STATUS + touched IDs.
    7.3 adds screens, public name tsignal.aispaces.ru, and the empty-loop rules above.
    7.6 adds fail-closed evidence references, non-overridable ZDR policy, honest per-card UI semantics,
    Figma three-module v4 and persistent loopback-only services. Scoring weights and thresholds stay unchanged.
    7.7 moves production to Ubuntu 26.04.1 VM232 and owns SearXNG/GPT Researcher locally.
    Adversarial review remains a proposed, disabled operator-gated experiment (ADR-011).
    The chief architect may close a card only after another hat re-runs the check.
    The implementer hat still cannot verify the increment it just wrote.
    Those rules live in this file. They are not a second controller inside the product.
    Do not revive a HANDOFF card. Do not share a chat card with another product.
    This product's queue is project thin-signals, agent cursor-bk2.
    The open door card is g-19b21906ceff. The live-query card g-6ea92015b4f8 stays in the queue and waits for another hat.
    Read it with goalctl active project=thin-signals agent=cursor-bk2.
    Coach and OpenMAIC stay on project coach-profi360 and agent cursor-agent.
    Critical path: logical model + harness + eval + RU UI (ADR-009). No weight training.
    Git SoT: SourceCraft; GitHub mirror for submission.
    Passwords and DNS keys stay in the host secrets file, never in this plan.

