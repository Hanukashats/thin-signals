# plan.yaml — Thin Signals LivingSet v7.3
# Machine-readable waves. Human narrative: docs/plan/PLAN_7.2.md, docs/plan/PLAN_7.3.md, CONCEPT, STATUS.
# 7.3 is a patch on 7.2. Waves W0–W6 stay. W4a/W4b/W4c are the added slices.

plan_revision: "7.3"
parent_revision: "7.2"
date: "2026-09-26"
deadline: "2026-09-29T23:59:00+03:00"
status: active
degrade_default: keep_ledger

execution:
  mode: goall
  architect_role: governor_planner
  fork_policy: BEST_FIT|MINIMAL|ALTERNATIVE
  autonomy_default: A1
  operator_gates:
    - A3
    - A4
    - secrets
    - security_p1
    - budget_exhausted
    - llm.provider
  cycle:
    - OBSERVE
    - EXECUTE
    - VERIFY
    - INTEGRATE
  empty_waves_before_hold: 2
  goal_loop:
    one_live_card_per_chat: true
    empty_checkpoints_before_replan: 2
    handoff_is_terminal: true
    verifier_is_a_different_bot: true
    telegram_bar_only_while_bot_replies: true
    report_after_each_wave: true
    consecutive_failures_before_stop: 2
    architect_names_unresolved_stoppers: true
  notes: >
    7.2 compresses the 11-step cycle to 4. INTEGRATE must update STATUS + touched IDs.
    7.3 adds screens, public name tsignal.agispace.ru, and the empty-loop rules above.
    Those rules live in this file. They are not a second controller inside the product.
    Do not revive a HANDOFF card. Do not share a chat card with another product.
    Critical path: logical model + harness + eval + RU UI (ADR-009). No weight training.
    Git SoT: SourceCraft; GitHub mirror for submission.
    Passwords and DNS keys stay in the host secrets file, never in this plan.

phases:
  - id: P0
    name: ContractFreeze
    window: ["2026-09-17", "2026-09-19"]
    goal: LivingSet 7.0/7.1 committed; SourceCraft bootstrap
    waves:
      - id: W0-living-plan
        status: completed
        owner: architect
        requirements: [LP-01, LP-02, LP-03]
        forks: []
      - id: W0b-bootstrap
        status: completed
        owner: architect
        deliverables: ["ADR-008", "docs/ops/SOURCECRAFT.md", "repo created on SourceCraft", ".gitignore", "check_living_links.py"]
        requirements: [LP-04, LP-06]
        forks: [implementation.path, hosting.sourcecraft]

  - id: P1
    name: Contract72
    window: ["2026-09-22", "2026-09-23"]
    goal: LivingSet 7.2 + donors with provenance + repo pushed + ts/ skeleton with policy tests
    degrade: keep_ledger
    waves:
      - id: W1-contract
        status: completed
        owner: architect/backend
        deliverables:
          - "CONCEPT/ARCHITECTURE/plan/forks/requirements/STATUS 7.2"
          - "ADR-009, docs/plan/PLAN_7.2.md, docs/METHODOLOGY.md"
          - "donors/ + reference/ + docs/lineage/handoff_2026-09-21 with hashes"
          - "git init + push SourceCraft"
          - "ts/ skeleton: pydantic schemas, scoring/policy.py (F03 fixed) + tests, compose (pgvector), pyproject"
          - "LiteLLM alias ts-llm-allowlisted (dev) + request keys"
        requirements: [LP-05, LP-07, DN-01, TZ-11, TZ-12, TS-INV-01, TS-INV-02, TS-INV-03, RM-01, LLM-01]
        forks: [tz.classifier, backend.reuse, graph.neo4j, ui.stack, goal.controller, runtime.adapter, llm.provider]

  - id: P2
    name: LogicalModel
    window: ["2026-09-23", "2026-09-24"]
    goal: Scorer + negatives corpus + ts eval with P/R/F1 report in organizer format
    waves:
      - id: W2-scorer-eval
        status: completed
        owner: AI/evaluation
        deliverables: ["ts/scoring rules-0.1.yaml", "data/negatives_v1.json", "ts eval CLI + adapter", "reports/eval_<date>.md", "docs/EVAL.md", "data/source_trust.yaml"]
        requirements: [TZ-01, TZ-02, EV-01, EV-02, EV-03, SC-02, TS-AG-17]
        forks: [tz.classifier]
        gate: ">=75% accuracy on holdout+negatives, else revise features not thresholds"

  - id: P3
    name: LivePath
    window: ["2026-09-24", "2026-09-26"]
    goal: Query -> TOP-15 with citations end-to-end on VM101 services
    waves:
      - id: W3-live
        status: in_progress
        owner: AI/backend
        deliverables: ["harness state machine + runs tables", "connectors SearXNG/arXiv/OpenAlex/Crossref/GitHub", "Docling snapshot", "LLM extraction JSON schema", "dedup TEI+pgvector", "countersearch maturity M01-M06", "ranking + exclusion registry"]
        requirements: [TZ-03, TZ-05, TZ-07, TZ-10, SC-03, SC-06, SC-07, SC-11]
        forks: [sources.epo_cordis, runtime.adapter, llm.provider]

  - id: P4
    name: AnalystUI
    window: ["2026-09-26", "2026-09-27"]
    goal: Russian Streamlit UI per TZ «Пример UI»
    waves:
      - id: W4-ui
        status: planned
        owner: frontend
        deliverables: ["query page", "TOP-15 list with confidence + predictors", "report page", "source cards trust/translation", "relations list", "exclusion registry", "counters"]
        requirements: [TZ-04, TZ-06, TZ-08, TZ-09, TZ-18, SC-12]
        forks: [ui.stack]
      - id: W4a-screens
        status: completed
        owner: cursor
        deliverables:
          - "viewer: direction, correction, period, run, document download"
          - "admin: settings, prompt draft, logic note, reasoning chain, hover help"
          - "roles admin/hanuka/yana and user1/user2/user3, hashes only on the host"
        requirements: [TZ-04, TZ-18]
        forks: [ui.stack]
        note: "Viewer runs without login. Admin, login and dashboard are not required for a live signal."
      - id: W4b-figma
        status: planned
        owner: codex
        deliverables: ["visual polish of the working W4a screens in Figma"]
        requirements: [TZ-04]
        forks: [ui.stack]
        note: "Do not start until W4a is reachable and the field-split test passes. After the public name, not before the viewer."
      - id: W4d-admin-optional
        status: planned
        owner: cursor
        deliverables: ["optional login", "admin notes", "dashboard"]
        requirements: [TZ-04]
        forks: [ui.stack]
        note: "Last and optional. A live signal must work with this wave still planned."
      - id: W4c-ingress
        status: planned
        owner: infra
        deliverables:
          - "DNS tsignal.agispace.ru to MikroTik Grigory public address"
          - "dst-nat 80/443 only onto VM101"
          - "reverse proxy with auto-renewing TLS"
          - "only the signals app; login stays optional; postgres and other backend ports stay closed"
        requirements: [TZ-13]
        forks: [hosting.sourcecraft]
        note: "agispace.ru is on FirstVDS nameservers, not in the Beget account. Do not change MikroTik guru360 hub NAT. Optional and after the viewer works."

  - id: P5
    name: Release
    window: ["2026-09-27", "2026-09-29"]
    goal: Laptop compose test, docs, GitHub mirror, slides 7-11, independent verification, submit
    waves:
      - id: W5-release
        status: planned
        owner: release/infra
        deliverables: ["README Docker", "requirements/lock", "pipeline doc + diagram", "GitHub mirror", "slides 7-11", "independent-verifier live query receipt", "backup/restore"]
        requirements: [TZ-13, TZ-14, TZ-15, TZ-16, TZ-17, SC-09]
        forks: [hosting.sourcecraft]
      - id: W6-submit
        status: planned
        owner: release
        deliverables: ["upload before 2026-09-29 23:59 MSK"]
        requirements: [ADM-01]
        forks: []

wave_routing:
  CONTINUE: proceed within phase
  SKIP: skip non-blocking wave with recorded reason
  JUMP: jump to listed wave_id when finding requires
  EXIT: hold phase; escalate to operator if P1/P2 blocker

removed_in_7_2:
  waves: [W1a-schema, W1b-import, W1c-idempotency, W2a-connectors, W2b-hermes-adapter, W2c-budgets-acl, W3a-patterns, W3b-graph, W3c-verification, W5a-eval, W5b-classifier, W6a-freeze, W6b-submit]
  reason: ADR-009 — merged into W1-W6 above; Neo4j/ACL/goal_control-18 dropped with replacement matrix
